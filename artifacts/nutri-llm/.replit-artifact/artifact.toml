kind = "web"
previewPath = "/"
title = "NutriLLM"
version = "1.0.0"
id = "artifacts/nutri-llm"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "pnpm --filter @workspace/nutri-llm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nutri-llm", "run", "build" ]
publicDir = "artifacts/nutri-llm/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
BASE_PATH = "/"
